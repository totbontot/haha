<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>For You.</title>
  <meta
    name="description"
    content="A little something, made just for you."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="container">

    <div class="top">
      <span class="mono">01 / 01</span>
      <span class="mono">for you</span>
    </div>

    <section class="hero">
      <p class="eyebrow">a small confession</p>

      <h1>
        I love
        <span>you.</span>
      </h1>

      <div class="line"></div>

      <p class="message">
        Nothing complicated.<br />
        Nothing dramatic.<br />
        Just something I've been meaning to say.
      </p>

      <button id="reveal">
        <span>read the rest</span>
        <span class="arrow">↗</span>
      </button>
    </section>

    <section class="hidden-message" id="message">
      <p class="quote">
        "Somehow, out of all the people in the world,
        I'm really glad I found you."
      </p>

      <div class="signature">
        <span>— with love</span>
      </div>
    </section>

    <footer>
      <span class="mono">made with intention</span>
      <span class="mono">© 2026</span>
    </footer>

  </main>

  <div class="grain"></div>

  <script src="script.js"></script>
</body>
</html>
