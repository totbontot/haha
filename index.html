<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <meta name="theme-color" content="#080808" />

  <title>Something for you.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Ambient background -->
  <div class="ambient"></div>
  <div class="noise"></div>

  <!-- Cursor / touch glow -->
  <div class="pointer-glow"></div>

  <main id="app">

    <!-- INTRO -->
    <section class="screen intro active" id="intro">

      <div class="top-bar">
        <span>01</span>
        <span>for someone</span>
      </div>

      <div class="intro-content">

        <p class="eyebrow">a little experiment</p>

        <h1>
          I made<br />
          <em>something.</em>
        </h1>

        <p class="subtext">
          It's not much.<br />
          But it's meant for you.
        </p>

        <button class="start-btn" id="startBtn">
          <span>open</span>
          <span>↗</span>
        </button>

      </div>

      <div class="bottom-bar">
        <span>tap to begin</span>
        <span>2026</span>
      </div>

    </section>


    <!-- JOURNEY -->
    <section class="screen journey" id="journey">

      <div class="progress">
        <div class="progress-fill"></div>
      </div>

      <div class="counter">
        <span id="stepNumber">01</span>
        <span>/ 04</span>
      </div>

      <div class="journey-content">

        <p class="eyebrow" id="journeyEyebrow">
          honestly
        </p>

        <div class="statement" id="statement">
          <span>Some people</span>
          <span>just make</span>
          <span>ordinary days</span>
          <span>feel different.</span>
        </div>

        <button class="next-btn" id="nextBtn">
          <span id="nextText">continue</span>
          <span>→</span>
        </button>

      </div>

    </section>


    <!-- FINAL -->
    <section class="screen final" id="final">

      <div class="final-orbit"></div>

      <div class="final-content">

        <p class="eyebrow">and that's all</p>

        <div class="final-title">
          <span>I</span>
          <span class="accent">love</span>
          <span>you.</span>
        </div>

        <p class="final-copy">
          No grand explanation.<br />
          No perfect words.<br /><br />
          Just the truth.
        </p>

        <button class="replay-btn" id="replayBtn">
          start over
        </button>

      </div>

      <div class="signature">
        made with intention.
      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
